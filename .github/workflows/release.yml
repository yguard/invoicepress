name: Build and Release

on:
  # Pushing a lowercase semantic-version tag is the only release request.
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # A tag push supplies the exact tag name, so no workflow input is required.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate the release tag format
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Reject ambiguous names before using the tag as the checkout ref and release identity.
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use lowercase vMAJOR.MINOR.PATCH, for example v0.1.0: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Validate tag and project version
        shell: bash
        run: |
          set -euo pipefail

          # The source at the tagged commit must declare the same version as the downloadable release.
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              print(tomllib.load(file)["tool"]["poetry"]["version"])
          PY
          )"

          if [[ "${RELEASE_TAG#v}" != "$PROJECT_VERSION" ]]; then
            echo "Tag version (${RELEASE_TAG#v}) must match pyproject.toml version ($PROJECT_VERSION)." >&2
            exit 1
          fi

  package:
    name: ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            platform: macos
            source: dist/InvoicePress-macos.zip
          - os: windows-latest
            label: Windows
            platform: windows
            source: dist/InvoicePress-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry>=1.8,<2.0"

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: make build-mac

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          poetry install --with dev
          poetry run pyinstaller --name InvoicePress --noconfirm --clean --windowed --add-data "invoice_pdf_printer/assets;invoice_pdf_printer/assets" --hidden-import=fitz invoice_pdf_printer/__main__.py
          Compress-Archive -Path "dist/InvoicePress/*" -DestinationPath "dist/InvoicePress-windows.zip" -Force

      - name: Stage versioned release package
        shell: bash
        env:
          RELEASE_ASSET: InvoicePress-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}.zip
        run: |
          set -euo pipefail

          # Versioned names keep downloaded files identifiable after leaving the Actions run.
          mkdir -p release-assets
          cp "${{ matrix.source }}" "release-assets/$RELEASE_ASSET"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: InvoicePress-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}.zip
          path: release-assets/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Fail before creating an empty release if artifact retention, naming, or an earlier job regressed.
          shopt -s nullglob
          assets=(release-assets/*.zip)
          if (( ${#assets[@]} != 2 )); then
            echo "Expected exactly two release archives, found ${#assets[@]}." >&2
            exit 1
          fi

          # Re-runs replace same-named assets rather than failing after the GitHub Release already exists.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "InvoicePress $VERSION" \
              --generate-notes
          fi
